services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: custom_crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: "@crm123"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d custom_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: